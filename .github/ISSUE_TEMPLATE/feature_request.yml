name: Đề xuất tính năng
description: Gợi ý cải tiến hoặc tính năng mới
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Vấn đề đang gặp
      description: Tính năng này giải quyết khó khăn gì trong vận hành thực tế
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Giải pháp đề xuất
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Phương án đã cân nhắc

  - type: dropdown
    id: scope
    attributes:
      label: Phạm vi
      options:
        - Mail Provider (WHMCS)
        - Addon giám sát (WHMCS)
        - Script
        - Tài liệu
        - HostBill
    validations:
      required: true
